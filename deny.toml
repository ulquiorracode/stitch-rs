# cargo-deny configuration for stitch-rs
# Normative policy: Apache-2.0 OR MIT licenses, no unmaintained/vulnerable crates, secure registry sources.

[graph]
targets = []

[licenses]
# The list of licenses we allow
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []
skip-tree = []

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
