name: "Bug Report"
description: "File a bug report against stitch-rs"
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please ensure you have tested against the latest version on the dev branch."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code example or test case reproducing the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust compiler version, architecture, target profile.
    validations:
      required: true
